    .filter-select {

      background-repeat: no-repeat; background-position: right 10px center;

    .filter-select:focus { border-color: var(--brand); }
    .delivery-count { margin-left: auto; font-size: 13px; color: var(--gray-400); white-space: nowrap; }

  { id:'D20260625001', name:'平安银行-税务企业名单', remark:'纳税评级B级及以上企业', source:'联合征信平台', count:320, customCols:['纳税评级','开票金额'], pool:true, deliveredAt:'2026-06-25 10:45', sender:'张薇', status:'received', fileName:'平安银行-税务企业名单_加密.xlsx', fileSize:'2.1 MB', fields:[{col:'企业名称',mapped:'企业名称',type:'必填'},{col:'统一社会信用代码',mapped:'社会信用代码',type:'必填'},{col:'纳税评级',mapped:'上一年度税务信用评级',type:'可选'},{col:'开票金额(万元)',mapped:'年开票额统计',type:'可选'},{col:'信用评分',mapped:'评分',type:'可选'}], preview:[{name:'苏州纺织集团有限公司',uscc:'91320500MAG****YE',score:695}]}
];

let currentPage = 1, pageSize = 10;
let filtered = [...DELIVERIES];
let confirmCallback = null;

function filterTable() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const pool = document.getElementById('poolFilter').value;
  filtered = DELIVERIES.filter(d => {
    const mq = !q || d.name.toLowerCase().includes(q) || (d.remark && d.remark.toLowerCase().includes(q));
    const mPool = pool === '' || String(d.pool) === pool;
    return mq && mPool;
  });
  currentPage = 1;
  renderTable();
}

function renderTable() {
  const total = filtered.length;
  document.getElementById('resultCount').textContent = '共 ' + total + ' 条记录';
  const start = (currentPage - 1) * pageSize;
  const page = filtered.slice(start, start + pageSize);
  const tbody = document.getElementById('tableBody');

  if (!page.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:48px;color:var(--gray-400);">暂无符合条件的名单交付记录</td></tr>';
  } else {
    tbody.innerHTML = page.map((r, idx) => {
      const colBadges = r.customCols.length
        ? r.customCols.map(c => '<span class="col-badge">' + c + '</span>').join('')
        : '<span style="color:var(--gray-300);font-size:12px;">—</span>';
      const newTag = r.status === 'new' ? '<span class="new-badge">NEW</span>' : '';
      return '<tr>' +
        '<td style="color:var(--gray-400);font-size:12.5px;">' + (start + idx + 1) + '</td>' +
        '<td>' +
          '<span class="delivery-name" onclick="openDrawer(\'' + r.id + '\')">' + r.name + '</span>' + newTag +
          (r.remark ? '<span class="delivery-remark" title="' + r.remark + '">' + r.remark + '</span>' : '') +
        '</td>' +
        '<td><strong>' + r.count.toLocaleString() + '</strong> 家</td>' +
        '<td>' + colBadges + '</td>' +
        '<td><span class="status-badge ' + (r.pool ? 'status-in-pool' : 'status-archived') + '">' + (r.pool ? '已入池' : '仅存档') + '</span></td>' +
        '<td style="color:var(--gray-500);font-size:12.5px;">' + r.deliveredAt + '</td>' +
        '<td style="color:var(--gray-600);">' + r.sender + '</td>' +
        '<td style="text-align:right;white-space:nowrap;">' +
          '<button class="btn btn-default btn-sm" onclick="openDrawer(\'' + r.id + '\')" style="font-size:12px;margin-right:6px;padding:3px 10px;background:#fff;border:1px solid var(--border);color:var(--gray-700);border-radius:6px;cursor:pointer;">查看</button>' +
          '<button class="btn btn-sm" onclick="downloadFile(\'' + r.id + '\')" style="font-size:12px;margin-right:6px;padding:3px 10px;color:#15803d;border:1px solid #86efac;background:#dcfce7;border-radius:6px;cursor:pointer;">下载</button>' +
          '<button class="btn btn-sm" onclick="prepareDelete(\'' + r.id + '\',\'' + r.name + '\')" style="font-size:12px;padding:3px 10px;color:#dc2626;border:1px solid #fecaca;background:#fff;border-radius:6px;cursor:pointer;">删除</button>' +
        '</td>' +
      '</tr>';
    }).join('');
  }

  // 渲染分页控件
  const totalPages = Math.ceil(total / pageSize) || 1;
  document.getElementById('paginationInfo').textContent =
    total ? '显示 1 到 ' + page.length + ' 条，共 ' + total + ' 条记录' : '共 0 条记录';

  let btns = '<button class="page-btn" onclick="goPage(' + (currentPage-1) + ')" ' + (currentPage===1?'disabled':'') + '><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>';
  for (let i = 1; i <= totalPages; i++) {
    btns += '<button class="page-btn ' + (i===currentPage?'active':'') + '" onclick="goPage(' + i + ')">' + i + '</button>';
  }
  btns += '<button class="page-btn" onclick="goPage(' + (currentPage+1) + ')" ' + (currentPage===totalPages?'disabled':'') + '><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>';
  document.getElementById('paginationControls').innerHTML = btns;
}

function goPage(p) {
  const t = Math.ceil(filtered.length / pageSize) || 1;
  if (p < 1 || p > t) return;
  currentPage = p;
  renderTable();
}

/* ════════ 详情抽屉 ════════ */
function openDrawer(id) {
  const d = DELIVERIES.find(x => x.id === id);
  if (!d) return;
  if (d.status === 'new') {
    d.status = 'received';
    renderTable();
  }
  document.getElementById('drawerTitle').textContent = d.name;
  document.getElementById('drawerSubtitle').textContent = '交付编号：' + d.id + '  ·  由 ' + d.sender + ' 交付';
  const fr = (d.fields||[]).map(f =>
    '<tr><td style="color:var(--gray-500);">' + f.col + '</td><td style="font-weight:600;">' + f.mapped + '</td><td><span class="' + (f.type==='必填'?'field-required':'field-optional') + '">' + f.type + '</span></td></tr>'
  ).join('');
  const pr = (d.preview||[]).map(p =>
    '<tr><td style="font-weight:600;">' + p.name + '</td><td style="font-size:12px;color:var(--gray-500);">' + p.uscc + '</td><td style="font-weight:700;color:var(--brand);">' + p.score + '</td></tr>'
  ).join('');
  document.getElementById('drawerBody').innerHTML =
    '<div class="detail-section"><div class="detail-section-title">基本信息</div><div class="detail-grid">' +
    '<div class="detail-item"><label>名单编号</label><span>' + d.id + '</span></div>' +
    '<div class="detail-item"><label>企业数量</label><span>' + d.count.toLocaleString() + ' 家</span></div>' +
    '<div class="detail-item"><label>交付时间</label><span>' + d.deliveredAt + '</span></div>' +
    '<div class="detail-item"><label>交付来源</label><span>' + d.source + ' (' + d.sender + ')</span></div>' +
    '<div class="detail-item"><label>导入机构客户池</label><span>' + (d.pool?'已入池':'仅存档') + '</span></div>' +
    '<div class="detail-item"><label>备注说明</label><span style="font-size:12.5px;">' + (d.remark||'—') + '</span></div>' +
    '</div></div>' +
    '<div class="detail-section"><div class="detail-section-title">数据文件</div>' +
    '<div class="file-download-card">' +
    '<div class="file-icon-wrap"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 18 15 15"/></svg></div>' +
    '<div class="file-info"><div class="file-name">' + d.fileName + '</div><div class="file-meta">AES-256 加密 · ' + d.fileSize + ' · 交付时间 ' + d.deliveredAt + '</div></div>' +
    '<button class="btn btn-sm" onclick="downloadFile(\'' + d.id + '\')" style="font-size:12px;color:#15803d;border:1px solid #86efac;background:#dcfce7;border-radius:6px;cursor:pointer;">下载</button>' +
    '</div></div>' +
    '<div class="detail-section"><div class="detail-section-title">字段映射规则</div>' +
    '<table class="field-table"><thead><tr><th>原始列名</th><th>系统映射字段</th><th>字段类型</th></tr></thead><tbody>' + fr + '</tbody></table></div>' +
    '<div class="detail-section"><div class="detail-section-title">数据预览（前 ' + d.preview.length + ' 条，脱敏展示）</div>' +
    '<table class="field-table"><thead><tr><th>企业名称</th><th>社会信用代码</th><th>信用评分</th></tr></thead><tbody>' + pr + '</tbody></table>' +
    '<div style="margin-top:10px;font-size:12px;color:var(--gray-400);">仅展示部分数据，完整企业清单及联调字段请下载原始 Excel 文件。</div></div>';
  document.getElementById('overlay').classList.add('show');
  document.getElementById('detailDrawer').classList.add('show');
}

function closeDrawer() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('detailDrawer').classList.remove('show');
}

function downloadFile(id) {
  const d = DELIVERIES.find(x => x.id === id);
  if (!d) return;
  if (d.status === 'new') {
    d.status = 'received';
    renderTable();
  }
  showToast('⬇️ 开始下载：' + d.fileName);
}

/* ════════ 删除 / 移除 ════════ */
function prepareDelete(id, name) {
  openConfirm(
    '确认删除？',
    '将删除交付名单「' + name + '」，此操作仅在机构端列表中移除记录。',
    function() {
      DELIVERIES = DELIVERIES.filter(r => r.id !== id);
      filterTable();
      showToast('已移除交付记录');
    }
  );
}

function openConfirm(title, desc, cb) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmDesc').textContent = desc;
  confirmCallback = cb;
  document.getElementById('confirmModal').classList.add('show');
  document.getElementById('confirmOkBtn').onclick = function() {
    closeConfirm();
    if(confirmCallback) confirmCallback();
  };
}

function closeConfirm() {
  document.getElementById('confirmModal').classList.remove('show');
}

document.getElementById('confirmModal').addEventListener('click', function(e) {
  if (e.target === this) closeConfirm();
});

/* ════════ Toast ════════ */
function showToast(msg) {
  const wrap = document.getElementById('toastWrap');
  wrap.textContent = msg;
  wrap.style.display = 'block';
  wrap.style.position = 'fixed';
  wrap.style.top = '24px';
  wrap.style.left = '50%';
  wrap.style.transform = 'translateX(-50%)';
  wrap.style.background = '#1e293b';
  wrap.style.color = '#fff';
  wrap.style.padding = '10px 20px';
  wrap.style.borderRadius = '8px';
  wrap.style.fontSize = '13.5px';
  wrap.style.zIndex = '9999';
  wrap.style.boxShadow = '0 8px 24px rgba(0,0,0,0.18)';
  setTimeout(() => { wrap.style.display = 'none'; }, 2400);
}

renderTable();
</script>
